name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: msys2 {0}
    env:
      AT_URL: https://ambermd.org/downloads/ambertools26_rc7.tar.bz2
      AT_SHA256: 5d46eef3c2bb7d5bf9e8c0c38add34406ea67e3f0e4097ac9d11d8a544538c9c
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar bzip2 patch flex bison diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-netcdf
            mingw-w64-ucrt-x86_64-netcdf-fortran
            mingw-w64-ucrt-x86_64-arpack
            mingw-w64-ucrt-x86_64-nlopt
            mingw-w64-ucrt-x86_64-python

      - name: Fetch AmberTools source
        run: |
          curl -sSL -o at.tar.bz2 "$AT_URL"
          echo "$AT_SHA256  at.tar.bz2" | sha256sum -c
          bunzip2 at.tar.bz2
          # MSYS2 emulates a symlink by copying its target, which fails when the
          # target comes later in the archive; a second pass finds it in place.
          tar -xf at.tar || echo "first pass left some symlinks unresolved"
          tar -xf at.tar --skip-old-files
          test -f ambertools26_src/dat/leap/parm/frcmod.xFPchromophores
          test -f ambertools26_src/AmberTools/src/leap/tleap.bat
          ls

      - name: Apply MinGW source fixes
        run: bash patches/apply.sh

      - name: Configure
        run: |
          mkdir build && cd build
          cmake ../ambertools26_src -G "MSYS Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/ambertools-win" \
            -DCOMPILER=GNU -DMPI=FALSE -DCUDA=FALSE -DOPENMP=FALSE \
            -DBUILD_PYTHON=FALSE -DBUILD_PERL=FALSE -DBUILD_GUI=FALSE \
            -DCHECK_UPDATES=FALSE -DDOWNLOAD_MINICONDA=FALSE -DINSTALL_TESTS=FALSE \
            "-DDISABLE_TOOLS=$(cat ../disable_tools.txt)" \
            "-DFORCE_DISABLE_LIBS=boost;tng_io" \
            -DCMAKE_Fortran_STANDARD_LIBRARIES=-lws2_32 \
            -DCMAKE_C_STANDARD_LIBRARIES=-lws2_32 \
            -DCMAKE_CXX_STANDARD_LIBRARIES=-lws2_32 2>&1 | tee configure.log
          sed 's/\x1b\[[0-9;]*m//g' configure.log | grep -A25 "3rd Party Libraries"
          sed 's/\x1b\[[0-9;]*m//g' configure.log | grep -A1 "Building Tools:"

      - name: Build
        run: |
          cd build
          make -j4 install 2>&1 | tail -200

      - name: Inspect install
        run: |
          ls -la ambertools-win/bin
          for e in teLeap antechamber parmchk2 sqm; do echo "== $e"; ldd "ambertools-win/bin/$e.exe" | grep -v -i "/c/windows" || true; done

      - name: Bundle runtime DLLs
        run: bash smoke/bundle_dlls.sh "$GITHUB_WORKSPACE/ambertools-win"

      - name: Probe executables without MSYS2 on PATH
        continue-on-error: true
        shell: pwsh
        run: ./smoke/probe.ps1 -AmberHome "$env:GITHUB_WORKSPACE\ambertools-win"

      - name: Smoke test
        continue-on-error: true
        run: |
          export AMBERHOME="$GITHUB_WORKSPACE/ambertools-win"
          export PATH="$AMBERHOME/bin:$PATH"
          bash smoke/run.sh "$GITHUB_WORKSPACE/smoke-out"

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-out
          path: smoke-out
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build/configure.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: Package
        run: |
          cp ambertools26_src/AmberTools/LICENSE ambertools-win/LICENSE-AmberTools.txt
          cp README.md ambertools-win/README-build.md
          cd "$GITHUB_WORKSPACE" && zip -qr ambertools26-win64-subset.zip ambertools-win || \
            powershell -NoProfile -Command "Compress-Archive -Path ambertools-win -DestinationPath ambertools26-win64-subset.zip"
          ls -la ambertools26-win64-subset.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ambertools26-win64-subset
          path: ambertools26-win64-subset.zip
